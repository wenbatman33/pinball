<!doctype html>
<html lang="zh-Hans" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1c2c" />
  <meta name="google" content="notranslate" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Exploring the Blue · Pinball</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
  <!-- 不經打包直接執行原始碼時（GitHub Pages 分支發布），由 CDN 載入 Phaser ESM；Vite 開發/打包時不受影響 -->
  <script type="importmap">{ "imports": { "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.esm.js" } }</script>
</head>
<body>
  <div id="game"></div>
  <div id="loading">LOADING…</div>

  <div id="hud">
    <!-- PC 左側 / Mobile 頂部 -->
    <section id="panelL" class="panel">
      <div class="logo"><span>EXPLORING</span><span>THE BLUE</span></div>
      <div class="stat big dmd"><label>SCORE</label><b id="score">0</b></div>
      <div class="row">
        <div class="stat"><label>BALL</label><b id="ballNo">-</b></div>
        <div class="stat"><label>BONUS</label><b id="mult">×1</b></div>
        <div class="stat hs"><label>HIGH</label><b id="high">0</b></div>
      </div>
    </section>
    <!-- PC 右側：操作說明 -->
    <section id="panelR" class="panel">
      <h3>操作</h3>
      <ul class="keys">
        <li><kbd>Z</kbd><kbd>←</kbd><kbd>L-Shift</kbd><span>左挡板</span></li>
        <li><kbd>/</kbd><kbd>→</kbd><kbd>R-Shift</kbd><span>右挡板</span></li>
        <li><kbd>Space</kbd><kbd>↓</kbd><span>按住蓄力，松开发射</span></li>
        <li><kbd>N</kbd><span>推台</span></li>
        <li><kbd>P</kbd><span>暂停</span> <kbd>M</kbd><span>静音</span></li>
      </ul>
    </section>

    <div id="saveLamp">SHOOT AGAIN</div>
    <div id="msg"><div id="msgTitle"></div><div id="msgSub"></div></div>

    <!-- 開始畫面 -->
    <div id="start" class="screen show">
      <div class="scr-inner">
        <div class="scr-tag">1990s ARCADE PINBALL</div>
        <div class="chrome-title"><span>EXPLORING</span><span>THE BLUE</span></div>
        <div class="scr-sub">探索蔚蓝 · 太空弹珠台</div>
        <button id="btnStart" class="scr-btn">开始游戏</button>
        <div class="dmd-box"><label>最高分</label><b id="startHigh">0</b></div>
      </div>
    </div>

    <!-- 結束畫面 -->
    <div id="over" class="screen">
      <div class="scr-inner">
        <div class="chrome-title red"><span>GAME OVER</span></div>
        <div class="scr-sub">游戏结束</div>
        <div class="dmd-box big"><label>本局得分</label><b id="overScore">0</b></div>
        <div id="overNew" class="new-record">★ 新纪录 ★</div>
        <div class="over-high">最高分 <b id="overHigh">0</b></div>
        <div id="overStats" class="over-stats"></div>
        <div class="scr-btns">
          <button id="btnAgain" class="scr-btn">再玩一次</button>
          <button id="btnMenu" class="scr-btn ghost">返回主菜单</button>
        </div>
      </div>
    </div>

    <div class="corner">
      <button id="muteBtn" title="静音 (M)">🔊</button>
      <button id="gearBtn" title="开发者调整 (D)" hidden>⚙</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
